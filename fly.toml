app = "muse-lsl"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  OTEL_EXPORTER_OTLP_ENDPOINT = "http://192.168.1.157:4317"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"
  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80
  [[services.tcp_checks]]
    interval = "10s"
    timeout = "2s"
    restart_limit = 0
    port = 8080
